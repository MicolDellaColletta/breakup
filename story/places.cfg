; Places on the town map. The [id] is the story section played on arrival
; (in story/town.txt).
; name        = shown on the map
; description = one line under the name
; travel      = minutes to get there (the same again to come back)
; x, y        = where it sits on the map, 0 to 1 across and down
; if          = only on the map when this holds (same as | if= in story files)

[pub]
name="The Gleaner"
description="Kettle Lake's only bar. Ruth's, and her wall of photographs."
travel=20
x=0.62
y=0.12
if="invited_to_pub and day<5 or day>=2 and day!=5 and day!=7 and day!=9"

[lake]
name="The lake shore"
description="Where the road ends. The ice isn't safe yet."
travel=10
x=0.30
y=0.34
if="day!=7"

[church]
name="The church"
description="Up the hill, past the lake road. The Thursday watch on the night radio."
travel=40
x=0.78
y=0.30
if="day>=2 and day!=5 and day!=7 and day!=9"

[cabin]
name="The cabin on the shore"
description="The lit window along the shore. Whoever walks the ice at night."
travel=15
x=0.18
y=0.48
if="visited:lake and day>=2 and day!=7"

[ruth_house]
name="Ruth's house"
description="Behind the Gleaner, the little house with the porch light. The bar's closed on Sundays."
travel=20
x=0.66
y=0.18
if="day==5 and flag:door_ruth_1 or day==5 and flag:ruth_upstairs or day==9 and flag:door_ruth_1 and !flag:broke_faith_ruth"

[town_line]
name="The town line"
description="Where the road out leaves Kettle Lake. The sign, the turnout, and then the highway."
travel=25
x=0.92
y=0.62
if="day==6"

[lunds]
name="The Lunds'"
description="Ezra's house, up the hill. Thursday: the Ladies' Circle. Every window lit."
travel=15
x=0.72
y=0.4
if="day==8"
