; Places on the town map. The [id] is the story section played on arrival
; (in story/town.txt).
; name        = shown on the map
; description = one line under the name
; travel      = minutes to get there (the same again to come back)
; x, y        = where it sits on the map, 0 to 1 across and down
; if          = only on the map when this holds (same as | if= in story files)

[pub]
name="The Gleaner"
description="Kettle Lake's only bar. Ruth's."
travel=20
x=0.62
y=0.12
if="invited_to_pub or day>=2"

[lake]
name="The lake shore"
description="A short walk down the road. The ice isn't safe yet."
travel=10
x=0.30
y=0.34

[church]
name="The church"
description="Up the hill, past the lake road. Thursday watch on the night radio."
travel=40
x=0.78
y=0.30
if="day>=2"

[cabin]
name="The cabin on the shore"
description="The shack with the lit window, along the shore from the poles."
travel=15
x=0.18
y=0.48
if="visited:lake and day>=2"
