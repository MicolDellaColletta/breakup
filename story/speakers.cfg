; Everyone who can speak in a story file. The [id] is what lines start with:
;   widow: Something my husband would have wanted.
; name  = shown above or before the line ("" shows no name)
; color = text color, as Color(red, green, blue, 1) from 0 to 1
; speed = letters per second while the line types out
; voice = true for the voices in MC's head: their name in capitals, their words in
;         italics. Without it, a character: name as written, plain words.

[narration]
name=""
color=Color(0.85, 0.87, 0.91, 1)
speed=30.0

[paranoia]
name="Paranoia"
color=Color(0.79, 0.71, 0.35, 1)
speed=45.0
voice=true
; When Paranoia is much louder than another voice, it cuts that voice off with
; one of these instead (once per section; docs/voices.md).
talks_over=["Quiet. Listen for the door.", "Don't think about that. Think about who's watching.", "Not now. Not now.", "Stop listening to that. Listen to me.", "That doesn't matter. Getting out matters."]

