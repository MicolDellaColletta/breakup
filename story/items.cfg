; Everything the player can carry.
; The [id] is what story files use:  take=pawn_ticket   lose=key   if=has:pawn_ticket
; document= is a file in story/documents/ the player can read from their pockets.

[key]
name="A key"
description="Brass, worn smooth by somebody else's hand. It fits the shop's front door."

[job_offer]
name="Job offer"
description="Typed, addressed to John. Folded and unfolded so many times the creases have gone soft."
document="job_offer"

[rental_agreement]
name="Rental agreement"
description="Northern Lights Auto Rental, Anchorage. The renter's name has run, as if the paper got wet."
document="rental_agreement"

[pawn_ticket]
name="Pawn ticket no. 0527"
description="From the glovebox. On the back, in pencil, the address of the shop, written twice, by someone afraid of losing it."

[letter]
name="Letter for the keeper"
description="FOR THE KEEPER. Eight rules, in handwriting that presses through to the other side of the page. Signed by a friend."
document="letter"

[polaroid]
name="Polaroid"
description="The shop at night, taken from the trees across the road. A dark sedan out front, where yours is parked. Dated last week, in pencil."

[back_door_key]
name="Key on a red tag"
description="Brass, cold from her pocket. BACK on the tag, in faded marker. Sergeant Olstad had it for years."

[church_bulletin]
name="Church bulletin"
description="Hidden under the drawer lining in the bedroom. Mimeographed, the ink gone purple. Someone wrote in the margin."
document="church_bulletin"

[carbon_copies]
name="Carbon copies"
description="From the office desk. The same job offer, typed every September, to a different name."
document="carbon_copies"

[compass]
name="Brass compass"
description="From the shop floor, bought and given back to you by the Reverend Elias. The needle settles on north slowly, as if it has to think about it first."

[rental_letter]
name="Letter from the rental company"
description="Northern Lights Auto Rental, Anchorage. Addressed to J. and a pale ghost of a name, care of the shop. Ruth brought it from the post office."
document="rental_letter"

[money_order]
name="Postal money order"
description="Interest, ticket 0527. Exact to the cent. No name. Postmarked Anchorage."
document="money_order"

[notebook]
name="Notebook"
description="A wide-ruled school notebook. KEEPER. 1999 on the cover, in Sam's hand. Two columns inside: what you saw, and what you think you saw."

[revolver]
name="Revolver"
description="John's. Wrapped in a towel. Six chambers, five rounds. The empty one turns under your thumb."

[locker_key]
name="Locker key"
description="A small steel key on a ring, stamped 114. With it, a slip of paper: ANCHORAGE GREYHOUND. LOCKER 114. PAID THRU 12/31/99. From the tin under ticket 0527."

[money_order_wasilla]
name="Second money order"
description="Interest, ticket 0527. Exact to the cent again. Postmarked Wasilla, November 2."
document="money_order_wasilla"

[money_order_kettle]
name="Third money order"
description="Interest, ticket 0527. Exact to the cent. Postmarked Kettle Lake, November 30. Bought at the store, from Ida's window."
document="money_order_kettle"

[abraham_rules]
name="Abraham's rules"
description="A card from the false bottom of the counter drawer, in the owner's hand, older than the letter upstairs. A different list. Nine rules, not eight."
document="abraham_rules"

[desk_key]
name="Small brass key"
description="Taped under the register's cash drawer with yellowed tape. A desk key, the kind with a hollow barrel."

[letter_1989]
name="Letter, 1989"
description="One of a bundle from Abraham's desk drawer: letters Keepers wrote and never posted. This one's from March 1989, and stops in the middle of a sentence."
document="letter_1989"

[church_deed]
name="Deed to the shop"
description="From the office safe. KETTLE LAKE PAWN & TAXIDERMY, the land and the building, held in trust since 1931 by the Congregation of the Lake. Abraham was never its owner."
document="church_deed"

[keeper_photo]
name="Photograph, 1989"
description="From a suitcase in a crate in the back room, initials J.W. on the lid. A young man on the shop's front step in a red flannel shirt, squinting into the sun. Brown eyes."

[burned_corner]
name="Burned corner of paper"
description="From the furnace's ash pan: a scrap the fire missed. A few words in a tidy, old-fashioned hand. The same hand as Thomas's line in the ledger."

[room_key]
name="Key on a string"
description="From Abraham's coat pocket, in the freezer. A door key on a loop of kitchen string, warm as soon as it was out of the cold. It fits nothing downstairs."

[ruth_diary]
name="Ruth's diary, 1989"
description="From the dressing table drawer in her room. A cheap diary with a lock that doesn't lock. One entry is pressed so hard it shows on the next three pages."
document="ruth_diary"

[abraham_letter]
name="Letter to Ruth"
description="From Abraham's other pocket, in the freezer. Addressed to Ruth in his hand. Never given. The paper soft with cold."
document="abraham_letter"

[bench_notebook]
name="Abraham's bench notebook"
description="From the drawer of the taxidermy bench. Every mount he made, with dates and materials. The bear has two entries."
document="bench_notebook"

[red_thread]
name="Red thread"
description="A length of red wool, left on the doorstep, tied in a loop the size of a wrist. His flock wear them. Leviticus: the scarlet thread on the goat's horns."

[note_bowl]
name="Note under the bowl"
description="A square of paper, folded once. Your handwriting, exactly. You don't remember writing it."
document="note_bowl"

[note_furnace]
name="Card from the steel door"
description="A card, pinned to the steel door with a tack. The owner's small, careful hand."
document="note_furnace"

[daniel_file]
name="LUND"
description="A school notebook from the washstand in his room, the name on the cover in his small upright hand. Everything about one house on the road, written down before he ever knocked."
document="daniel_file"

[boy_photo]
name="Photograph"
description="From the cigar box on his windowsill. A boy of seventeen on a lake shore in summer, wet to the waist. Your face, eleven years ago."

[hollis_ring]
name="Ray Hollis's ring"
description="A man's wedding band, from the suitcase under his bed. Mrs. Hollis put it on the plate in January."

[sixth_round]
name="The sixth round"
description="A .38 bullet, flattened, cleaned. It went into him in October. He gave it back. It fits the empty chamber, somehow."


[paraffin]
name="Paraffin and matches"
description="From the bear's second seam: a square tin of paraffin, the cap wired shut, and a box of kitchen matches in a sandwich bag. Abraham's \"other thing, if it comes to it.\""

[wasilla_matchbook]
name="Matchbook"
description="From the Northern Lights Motor Inn, Wasilla. Room 11 written inside the flap in pencil, and under it: Nov 1-3. Left under a quarter on the counter."

[john_polaroid]
name="Polaroid, JOHN. 1999."
description="The Polaroid from the Gleaner's wall of faces, the one with your face on it. Pushed under the shop door in the night. A pencil line across the top, like a height mark. On the back: APRIL 22."
