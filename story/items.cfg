; Everything the player can carry.
; The [id] is what story files use:  take=pawn_ticket   lose=key   if=has:pawn_ticket
; document= is a file in story/documents/ the player can read from their pockets.

[key]
name="A key"
description="Brass, worn smooth. It fits the shop's front door. You're sure it isn't yours."

[job_offer]
name="Job offer"
description="Typed, addressed to John. Folded and unfolded so many times the creases have gone soft."
document="job_offer"

[rental_agreement]
name="Rental agreement"
description="Northern Lights Auto Rental, Anchorage. The renter's name has run, as if the paper got wet."
document="rental_agreement"

[pawn_ticket]
name="Pawn ticket no. 0447"
description="From the glovebox. On the back, in pencil, the address of the shop."

[letter]
name="Letter for the keeper"
description="Eight rules, in handwriting that presses through to the other side of the page."
document="letter"

[polaroid]
name="Polaroid"
description="The shop at night, taken from the trees across the road. Your car is parked outside. Dated last week."

[back_door_key]
name="Key on a red tag"
description="Brass, cold from her pocket. BACK on the tag, in faded marker. Sergeant Olstad had it for years."
