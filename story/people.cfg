; What the people who come to the counter look like: placeholders drawn in
; code (scripts/person_art.gd) until there are paintings. The [id] is the
; speaker id in story files (speakers.cfg). Voices are never drawn.
;
; height = 0.7 (small) to 1.0 (tall)       build = 0.7 (slight) to 1.2 (broad)
; coat   = colour of the coat               style = parka, coat, jacket, cassock, uniform
; hat    = none, cap, toque, hood, scarf, fur (with hat_color)
; hair   = short, long, bun, bald, none (under the hat), with hair_color
; skin   = colour                            eyes  = tired, sharp, kind, down, wide
; mouth  = flat, thin, frown, smile
; extras = any of: glasses, beard, collar, pregnant (comma-separated)

