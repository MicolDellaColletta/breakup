; Things you can look at, room by room. For now each one is a button; once
; there's art, each becomes a clickable spot on the picture (add x= and y=
; from 0 to 1 across and down, like places.cfg).
;
; scene   = which scene it's in: "shop" (after closing) or "night"
; room    = where in that scene (shop: counter, floor, office, hallway;
;           night: apartment)
; label   = the button text
; section = the story section it plays (day_one.txt for the shop,
;           night_one.txt for the night)
; if      = only there when this holds (same as | if= in story files)
; Each one can be looked at once per visit. They show in the order written.

; --- The shop, after closing (story/day_one.txt) ---

