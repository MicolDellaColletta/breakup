; Things you can look at, room by room.
;
; scene   = which scene it's in: "drive", "shop" (after closing) or "night"
; room    = where in that scene (drive: car; shop: counter, floor, office,
;           hallway; night: apartment)
; label   = its name, shown when the mouse is over it (or on its button)
; section = the story section it plays (drive.txt for the drive,
;           shop_looks.txt for the shop, each night's file for the night)
; if      = only there when this holds (same as | if= in story files)
; Scenes with a picture (the drive, so far) make each one a clickable hotspot:
; rect    = "x, y, width, height", each from 0 to 1 of the screen
; sound   = played the moment it's clicked (a sound the scene has)
; hidden  = true: not there until the scene shows it
; Scenes without a picture yet show a button per spot, in the order written.
; Each one can be looked at once per visit.

