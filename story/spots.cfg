; Things you can look at, room by room.
;
; scene   = which scene it's in: "drive", "shop_night" and "apartment_first"
;           (the first night), "shop" (after closing), "night", or "examine"
;           (a close-up of a thing from the shelves; room = its item id)
; room    = where in that scene (drive: car, glovebox, mirror; shop_night: floor,
;           counter, hallway, office; apartment_first: main, hall, bathroom,
;           bedroom; night: main, hall, bedroom, and downstairs shop_hall and
;           shop_counter for the phone; shop: counter, floor, office,
;           hallway)
; label   = its name, shown when the mouse is over it (or on its button)
; section = the story section it plays (drive.txt for the drive,
;           shop_looks.txt for the shop, each night's file for the night)
; if      = only there when this holds (same as | if= in story files)
; Every scene has a picture now, so each spot is a clickable hotspot:
; rect    = "x, y, width, height", each from 0 to 1 of the screen
; sound   = played the moment it's clicked (a sound the scene has)
; go      = walk to that room instead of playing a section (no section needed)
; arrow   = forward, back, left or right: drawn as an arrow, always faintly visible
; again   = true: can be clicked again (most things are done once looked at)
; hidden  = true: not there until the scene shows it
; use_<item> = the section (in story/use.txt) that plays when that item from
;           your pockets is used on it: use_compass="use_compass_painting".
;           Any other item plays use_nothing.
; seen    = the section (in story/use.txt) for a second look at it, once it's
;           been looked at; without one, the seen_ replies take turns.
; Each one can be looked at once per visit.

