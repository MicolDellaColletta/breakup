[thermos]
shape="thermos"
shelf="floor"
arrives=true
name="Thermos"
price=6
ledger="In Abraham's crates in the back, never priced. Put out this season."
description="A steel Stanley, dented, the green paint worn to the metal where a hand held it. The cup still on."
prop_warmth="Warm. It's been in a crate in the back room since before you came, and it's warm."
prop_story="The kind every ice fisherman on the lake carries out at dawn. The kind they bring home empty."

[leg_trap]
shape="trap"
shelf="floor"
arrives=true
name="Leg-hold trap"
price=12
ledger="In Abraham's crates in the back, never priced. Put out this season."
description="A Victor No. 3, jaws open, set and wired so it can't spring. Oiled, recently. A tag on the chain, blank."
prop_marks="The tag on the chain is blank on one side. On the other, in pencil: NOT FOR FOX."
prop_mechanism="The wire holding it open has been cut and twisted back, twice. Somebody opened it and set it again."
