; What's in the shop. Different from items.cfg, which is what's in your pockets.
; shelf    = "floor" (for sale, out front), "back" (pawned, held, not for sale)
;            or "drawer" (kept under the counter: never on show, but in the ledger)
; price    = dollars, for floor items
; pawn_tag = ticket number, for back-shelf items; "new" gives the next number
;            in the book when it's pawned
; arrives  = true for things someone brings in during the game (pawned= in a
;            story file): not in the shop or the ledger until then
; ledger   = the old owner's entry for it, shown in the ledger
; shape    = how its placeholder picture is drawn (scripts/item_art.gd): call,
;            decoy, knife, snowshoes, picks, compass, fox, rifle, tin, coins,
;            box, name, jacket, musicbox, mirror, watch, jar, braid, shells, bible,
;            spectacles, button, clapper, microphone, collar, bullet, batteries,
;            lantern, radio, thermos, trap.
;            Anything else is drawn
;            as a wrapped bundle.
; A voice can comment on an item once it's strong enough:
;   appraisal="The stamp on the bottom. It isn't his."   appraisal_at=1
; Hidden properties, found with a tool or in a story (docs/shop.md, "Objects";
; scripts/props.gd): prop_marks, prop_material (the loupe); prop_warmth,
; prop_sound, prop_smell (handling it); prop_mechanism, prop_story, prop_folk,
; prop_plain (examining, people, learn=item/kind in a story file).
; catalogue = the owner's own note on it, in the back of the ledger. Things that
; came in this season have none.
; The [id] is what story files use: a customer who is given the duck call plays
; the section "widow_given_duck_call" if it exists, otherwise "widow_given_other".

[duck_call]
shape="call"
shelf="floor"
name="Duck call"
price=15
description="Hand-carved from cedar, the reed worn soft from years of use. Two letters scratched into the side: R.H."
ledger="Feb. '99. R. Hollis. Cedar duck call, his own carving. Paid $4."
catalogue="R. Hollis carves his own and never sold one before this. Blown at the shore the night of the Run, they say, so the lake knows whose it is."
prop_marks="R.H. cut with a knife point. Under it, older and fainter, a second set of letters someone sanded off."
prop_material="Red cedar. The reed's a strip cut from a coffee-can lid."
prop_sound="Not a duck. One low, flat note, like something calling from a long way under the ice."
prop_smell="Cedar, and pipe tobacco, and the inside of a coat pocket."
prop_folk="Blown at the shore, it tells the lake whose you are. A man who carries his own call comes home."

[decoy]
shape="decoy"
shelf="floor"
name="Mallard decoy"
price=20
description="Painted wood, the green on the head flaking away. Stamped on the bottom: PROPERTY OF KETTLE LAKE ROD & GUN CLUB."
ledger="Mar. '99. In a box lot from the Rod & Gun Club. Not strictly ours to sell."
appraisal="The stamp on the bottom. It isn't his."
appraisal_at=1
catalogue="Club decoy, box lot. The Club don't count them any more. Paint's original, which is worth something to someone, not here."
prop_marks="PROPERTY OF KETTLE LAKE ROD & GUN CLUB, burned into the base. And a number, 14, in pencil, under the paint."
prop_material="Cedar body, pine head, the old lead weight still nailed underneath."
prop_sound="Knock it: hollow. Something small rolls inside, end to end."
prop_story="Number 14 of a set of twenty the Club put out every fall, and took in every spring. One fall they only took in nineteen."

[skinning_knife]
shape="knife"
shelf="floor"
name="Skinning knife"
price=25
description="Bone handle. The blade has been sharpened so recently there are still filings in the sheath."
ledger="Aug. '99. Walked in, gave no name. Paid $6."
catalogue="No name given. Blade's good Swedish steel. Sharpened past what any skinning wants."
prop_marks="A maker's stamp worn almost smooth: a crown, and MORA. Scratched on the bolster, a tally: eleven lines."
prop_material="Moose bone handle, Swedish carbon steel, filed so thin the edge has started to wave."
prop_smell="Gun oil. Under the oil, iron, the way a butcher's block smells."
prop_plain="A skinning knife sharpened for something tougher than skin. Rope. Cord. Hide that's frozen."

[snowshoes]
shape="snowshoes"
shelf="floor"
name="Snowshoes"
price=30
description="Bentwood and rawhide. One binding has been replaced with a twist of wire, by someone who meant to use them again."
ledger="Apr. '98. From the Keeper's things, after breakup."
catalogue="The Keeper's, '98. Bentwood, Athabascan pattern. Mended once, by him, to walk out on. Didn't."
prop_marks="Burned into one frame, small: K. 97-98. The other frame has the same letters, burned out again with a nail."
prop_material="Ash frames, rawhide lacing. The wire on the binding is fence wire, cut with a knife, not cutters."
prop_smell="Woodsmoke, and wet wool, and the lake."
prop_story="The last Keeper's. He mended the binding himself, the week before breakup. He meant to walk out on them."

[ice_picks]
shape="picks"
shelf="floor"
name="Ice picks"
price=12
description="Two wooden handles the size of your fist, each with a steel spike, joined by a cord you wear around your neck. If you go through, you stab the ice and haul yourself out."
ledger="Mar. '99. R. Hollis. Traded in for a box of shells. Said he wouldn't need them this year."
catalogue="Ray's. Traded for shells in March. 'Won't need them this year.' Wrote that down because I didn't like it."
prop_marks="R.H. burned into each handle, and the year of every winter they went out on the ice, a column of them."
prop_material="Birch handles, steel spikes ground from big nails. The cord's new; the knots are old."
prop_smell="The lake. It doesn't come out of the cord."
prop_folk="You don't give back the picks a man traded. Whoever wears them next goes out where he went."
prop_plain="If you go through, you stab the ice and haul. Most who go through without them don't come up."

[compass]
shape="compass"
shelf="floor"
name="Brass compass"
price=20
description="The needle settles on north slowly, as if it has to think about it first."
ledger="Apr. '97. From the Keeper's things, after breakup."
catalogue="Keeper's things, '97. Swings. Points to the drowned, the old ones say. I never tested it and I never will."
prop_marks="Engraved inside the lid, worn: TO W. FROM THE CONGREGATION, 1958."
prop_material="Brass case, a glass that isn't the first one, a needle that's been remagnetized by hand."
prop_sound="Shake it: a faint tick, the needle knocking its pin, settling. Settling slower than it should."
prop_folk="Points to the drowned. Lay it on the ice and it'll show you where they are."
prop_plain="Swings to iron. Nails, a stove, a steel door. Two iron nails behind a painting."

[fox]
shape="fox"
shelf="floor"
name="Mounted fox"
price=60
description="A red fox, caught mid-step. Whoever set the glass eyes put them a little too far apart. It looks surprised."
ledger="Jan. '97. Mounted here. The eyes were my mistake."
catalogue="Mine. First winter I tried the eyes myself. Too far apart. It's been watching the door ever since, and I don't like what it sees."
prop_marks="Under the base, in pencil: A., Jan. '97. Beside it, small: 'eyes wrong'."
prop_material="A red fox over a carved form, wire in the legs, the glass eyes a size too big."
prop_warmth="Cold, as it should be. Except the base, under the paws, which is the temperature of a hand."
prop_smell="Borax and old fur. Faintly, pipe smoke."

[rifle]
shape="rifle"
shelf="back"
name="Hunting rifle"
pawn_tag="0431"
description="A Winchester .30-06, cleaned and oiled. The pawn tag is dated three weeks ago."
ledger="Sep. '99. $40 loan, due at breakup. No name. 'He'll be back for it' (underlined twice)."
catalogue="No name. $40, due at breakup. He'll be back for it. He always is."
prop_marks="Serial number filed off, carefully. On the stock, carved deep: a line with four lines crossing it."
prop_material="Winchester Model 70, walnut stock, blued steel, cleaned after every use. Used recently."
prop_smell="Fresh gun oil, and cordite underneath. It's been fired since it came in."
prop_story="Pawned every autumn, three weeks before the first ice. Redeemed every spring, at breakup. The same rifle. Never the same name."

[tin_box]
shape="tin"
shelf="back"
name="Tin box"
pawn_tag="0527"
description="The kind cough drops used to come in, closed with a padlock no bigger than your thumbnail. Something shifts inside when you tilt it. The name on the tag has been scratched out."
ledger="May '99. Held. No loan, no price. The name is scratched out so hard the pen went through the page."
catalogue="0527. Held. No price. I scratched the name out myself. Don't open it. Don't sell it. Don't let them take it."
prop_marks="On the bottom, scratched with a pin: DAN 5:27. The padlock's stamped with the same four crossed lines as the rifle."
prop_material="A cough-drop tin, painted over twice. The padlock is newer than the tin."
prop_warmth="Cool. Then, as you hold it, warmer than your hand. You put it down."
prop_sound="Tilt it: something light slides, and something small and hard follows it. Paper, and a ring, maybe."

[silver_dollars]
shape="coins"
shelf="back"
name="Thirty silver dollars"
pawn_tag="0432"
arrives=true
description="Morgan dollars in a paper roll, thirty of them, worn smooth. Still warm when you put them on the shelf. You haven't touched them since, to check."
ledger="Oct. '99. Thirty silver dollars. Brought in still warm."
prop_marks="Morgan dollars, 1880s, mint marks all CC: Carson City. Every one rubbed bright on the same side."
prop_material="Silver, worn soft. The paper roll is a page torn from a hymnal."
prop_warmth="Warm. Days later, still warm. Warmer than your hand."
prop_sound="In the roll they don't clink. They move together, like something breathing."

[shells]
shape="shells"
shelf="drawer"
name="Box of .22 shells"
price=6
description="One box, fifty rounds. A slip of paper under the rubber band, in the owner's hand: THURS."
ledger="Kept in the counter drawer for E. Lund. Thursdays."
catalogue="E. Lund, Thursdays. One box. Hasn't hunted in twenty years. Never asked him what for and he never offered."
prop_marks="THURS on the slip, in my hand. The box is a brand they stopped making in the seventies."
prop_material="Fifty .22 long rifle. The cardboard's soft with age; the rounds are clean and new."
prop_story="Ezra Lund buys one box every Thursday, for a .22 he hasn't hunted with in twenty years. What he shoots on a Thursday, nobody says."

[ice_picks_held]
shape="picks"
shelf="back"
name="Ice picks"
pawn_tag="new"
arrives=true
description="Ray Hollis's ice picks, back again. One spike is bent. The cord still smells of the lake."
ledger="Oct. '99. Ray Hollis's ice picks, brought back by Cody Hollis. They worked."
prop_marks="R.H. on each handle. One new line burned under the column of years: this one."
prop_material="The same birch, the same spikes. One spike bent back on itself, as if it had hit stone under the ice."
prop_smell="The lake, stronger than before. And something under it, sweetish."
prop_story="Ray's picks, worn out onto the ice by Cody, and brought back. They worked."

[name_ida]
shape="name"
shelf="back"
name="One name"
pawn_tag="new"
arrives=true
description="Not a thing. A ticket stub, standing on an empty patch of shelf where something should be. One name, in your own handwriting. You don't say it, even to yourself."
ledger="Oct. '99. One name. No loan. Not to be said."
prop_marks="Your own handwriting. The ink's gone brown, as if it were years old."
prop_warmth="There's nothing to touch. The shelf where it stands is cold, colder than the shelves either side."

; --- Day three: three held things that could be what June Merrill's mother
; left (only one sang, and only one has her name in it), and Ray's jacket. ---

[music_box]
shape="musicbox"
shelf="back"
name="Music box"
pawn_tag="0311"
description="Walnut, the size of a hymnal, the lacquer worn through where hands held it. A key in the side, wound down."
ledger="Mar. '93. Music box. M. Sundqvist. Held. No loan. She said she'd be back for it in the spring."
catalogue="0311. M. Sundqvist. Plays a hymn I don't know. She'll be back in the spring, she said. Spring of '93."
prop_marks="Under the lid, a name scratched in a child's capitals. Inside the works, a maker's plate: REUGE, STE-CROIX."
prop_material="Walnut over pine, Swiss works. The comb's missing two teeth; the tune skips where they were."
prop_sound="Wind it and it plays a slow tune, three notes short, like a hymn with the words left out."
prop_mechanism="A false floor under the cylinder, held by one brass screw."

[hand_mirror]
shape="mirror"
shelf="back"
name="Hand mirror"
pawn_tag="0347"
description="Silver backed, the glass gone gray at the edges. Initials engraved in the silver, worn soft."
ledger="Jun. '95. Hand mirror, silver backed. Initials J.M. Paid $8."
catalogue="0347. J.M., silver backed. Paid $8. The glass doesn't like being looked into after dark. Turn it face down."
prop_marks="J.M. in script, engraved, worn soft by a thumb. A jeweller's mark: STERLING, and a little anchor."
prop_material="Sterling back, the glass silvered by hand. Gray at the edges where the silver's lifted."
prop_warmth="Cold glass. The back warms in your hand and stays warm after you put it down."
prop_folk="Don't look into it after dark. Turn it face down, so it can't look back."

[pocket_watch]
shape="watch"
shelf="back"
name="Pocket watch"
pawn_tag="0402"
description="Gold plate over brass, a dent in the case. It isn't running."
ledger="Nov. '98. Pocket watch, maker's name inside the case. Paid $15. Never came back."
catalogue="0402. Maker's name inside. Stopped. Don't wind it. I wound it once."
prop_marks="Inside the case, a maker's name: ELGIN. Below it, scratched: 1989. The hands stand at 5:27."
prop_material="Gold plate over brass, the plating worn through at the bow. The crystal's cracked in a star."
prop_sound="Silent. Then, held to your ear long enough, one tick. Only one."
prop_mechanism="The back unscrews. Something folded is wedged behind the movement."

[hollis_jacket]
shape="jacket"
shelf="back"
name="Hunting jacket"
price=10
pawn_tag="new"
arrives=true
description="Waxed canvas, the color of dead grass. R. HOLLIS stitched inside the collar in red thread. It was warm when it came in."
ledger="Oct. '99. Hunting jacket, R. HOLLIS in the collar. Brought in by a stranger. Brought in warm."
prop_marks="R. HOLLIS in red thread inside the collar. The stitching's newer than the jacket."
prop_material="Waxed canvas, wool lining, one button missing: brass, big, the kind on a heavy coat."
prop_warmth="Warm. Warm the way a coat is warm when someone's just taken it off."
prop_smell="Woodsmoke, wax, and the lake."


; --- What the town leaves with the shop. Logged like anything else
; (docs/underneath.md). ---

[tooth_jar]
shape="jar"
shelf="back"
name="Jar of milk teeth"
pawn_tag="0398"
description="A baby-food jar, the label soaked off. Inside, small teeth, each one twisted up in a scrap of paper. You can see writing on the paper."
ledger="Feb. '97. Jar of milk teeth, labelled. Held. No loan. For the church, when asked."
catalogue="0398. Milk teeth, labelled. For the church, when asked. They always ask."
prop_marks="Each scrap of paper has a name and a year. The years go back to 1958. The names are every child in town."
prop_material="A baby-food jar, the same make as the one of glass eyes in the back room."
prop_sound="Shake it: a dry patter, like rain starting."
prop_folk="A child's tooth kept by the church keeps the child. Off the ice. Out of the lake."

[braid]
shape="braid"
shelf="back"
name="Braid of hair"
pawn_tag="new"
arrives=true
description="Fair hair, a girl's, braided tight and tied at both ends with red wool. Cut this morning. It still smells of soap."
ledger="Oct. '99. Braid of hair. Hanna Lund. Held. For the church, when asked."
prop_marks="Tied at both ends with red wool, knotted the same way the yarn is knotted in the coat in the vestry."
prop_warmth="Warm still. Hours later."
prop_smell="Soap, and under the soap, lanolin."
prop_folk="Sewn into the hem, it's a promise the girl makes for herself. Given to the shop, someone made it for her."

[brass_button]
shape="button"
shelf="back"
name="Brass button"
pawn_tag="new"
arrives=true
description="A big brass button, the kind on a heavy coat. A scrap of brown wool still caught in the shank. It was frozen into the ice off the point."
ledger="Oct. '99. Brass button, coat. Cody Hollis. Chipped out of the ice."
prop_marks="On the back, around the shank: a maker's name, and a line with four lines crossed through it."
prop_material="Brass, heavy. A scrap of brown wool caught in the shank, the same brown as the coat in the vestry."
prop_warmth="Ice-cold. It stays cold, on the shelf, in the warm."
prop_smell="The lake. Lanolin."

[father_watch]
shape="watch"
shelf="back"
name="Pocket watch, stopped"
pawn_tag="new"
arrives=true
description="A steel pocket watch on a short chain, the case worn smooth by a thumb. Stopped at nine. It was warm when he put it down."
ledger="Dec. '99. Pocket watch, steel. D. Pawned. His father's."
prop_marks="Engraved inside the case, worn nearly away: a man's initials, and a year: 1959."
prop_material="Steel, a cheap movement, a new crystal. The hands bent very slightly toward each other, as if someone had pressed them."
prop_sound="Wind it: it runs. Tick, tick, a whole minute. Then it stops. At nine."
prop_warmth="Warm when it came in. It stays warm on the cold back shelf, the way the bullet did."
prop_folk="A watch stopped at an hour is a promise kept at that hour. Thursday watch, nine o'clock."

[bible_cut]
shape="bible"
shelf="back"
name="Family Bible, cut"
pawn_tag="new"
arrives=true
description="The shop's oldest Bible, the one he bought on the first of December. He brought it back. Leviticus 16 is gone: cut out at the gutter with a razor, clean, every page."
ledger="Dec. '99. Bible, family, returned by D. No loan. Leviticus 16 removed."
prop_marks="Names on the flyleaf going back to 1871, and under the last of them, in pencil, new: a blank line."
prop_material="Calfskin, gone soft. The cut so clean the remaining pages close over the gap as if it had never been there."
prop_smell="Old paper, and woodsmoke. The church's woodsmoke."

[spectacles]
shape="spectacles"
shelf="back"
name="Reverend's spectacles"
pawn_tag="new"
arrives=true
description="Wire spectacles, the frame blackened and bent. Brought in a box with the other church things after the fire. The lenses are whole. Not a crack."
ledger="Dec. '99. Spectacles, wire. The Reverend's. From the vestry. Held for the church."
prop_marks="The left earpiece bent where he pushed it up into his hair when he read."
prop_material="Wire, soot-black. Glass lenses, clean. Glass cracks in a fire hot enough to blacken wire. These didn't."
prop_plain="Either they weren't in the fire, or they weren't on his face when it started."
prop_folk="A dead man's spectacles see what he saw last. Look through them at the ruin and you'll see the door."

[bell_clapper]
shape="clapper"
shelf="back"
name="Bell clapper"
pawn_tag="new"
arrives=true
description="The iron clapper from the church bell, black, the size of a man's forearm. The bell cracked in the fire and dropped through the tower. This came out of the ashes whole."
ledger="Dec. '99. Bell clapper, iron. From the church. Held for the church."
prop_material="Cast iron, heavy. Black scale on it that comes off on your hands."
prop_sound="Lift it and let it swing against your palm: nothing. A clapper without a bell is just weight."
prop_folk="It rang the night of the fire, by itself, before anybody pulled the rope. People say so."

[microphone]
shape="microphone"
shelf="back"
name="Melted microphone"
pawn_tag="new"
arrives=true
description="The radio booth's microphone, melted half through, its cord a black stub. The grille's fused into a face, almost."
ledger="Dec. '99. Microphone, broadcast. From the vestry booth. Held for the church."
prop_material="Chrome and Bakelite, slumped. The cord burned to the plug."
prop_sound="Hold it to your ear like a shell. You won't hear anything. You'll listen anyway."

[reverend_collar]
shape="collar"
shelf="back"
name="Clerical collar"
pawn_tag="new"
arrives=true
description="A white clerical collar, folded once, the inside gone yellow at the neck. It came in the envelope with the money, with a stub in Ezra's hand. No loan."
ledger="Dec. '99. Clerical collar. E. Lund, for the church. No loan. Held."
prop_marks="Laundry mark inside: E. A number after it, written over many times."
prop_material="Celluloid, the old kind. Cracked once and glued."
prop_smell="Instant coffee. Hair oil. The radio booth."
prop_folk="A collar left at the shop is a man the church has finished with."

[sixth_bullet]
shape="bullet"
shelf="back"
name="Flattened bullet"
pawn_tag="new"
arrives=true
description="A revolver bullet, flattened against something soft and then something hard. Cleaned. It came in in an envelope. It was warm."
ledger="Nov. '99. One bullet, flattened. Brought in by a man passing through. Warm."
prop_marks="A .38. Scratched into the base, very fine, the way you'd scratch with a pin: a date in October."
prop_material="Lead, flattened, cleaned. A thread of brown wool pressed into the lead."
prop_warmth="Warm. It came in warm and it's still warm."
prop_smell="Nothing. Somebody's washed it, carefully, more than once."

