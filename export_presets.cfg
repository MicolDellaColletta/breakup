; Export presets. The story is read as plain text (story/*.txt, *.cfg), which
; Godot leaves out of an export unless the non-resource filter names it; the
; tests, tools and docs stay out. Needs the 4.7.2 export templates installed
; (Editor > Manage Export Templates).

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="story/*.txt, story/*.cfg, story/*/*.txt, story/*/*.cfg"
exclude_filter="tests/*, tools/*, docs/*"
export_path="build/windows/Breakup.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/product_name="Breakup"
application/file_description="Breakup"
application/modify_resources=false

